Foreground yes
User clamav
LocalSocket /run/avaas/clamd.sock
LocalSocketMode 666
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /var/lib/clamav-tmp
LogFile /var/log/avaas/clamav.log
LogTime yes
LogRotate yes
LogFileMaxSize 20M
MaxThreads 2
MaxQueue 4
ReadTimeout 7200
CommandReadTimeout 30
MaxScanTime 7200000
MaxScanSize 2147483648
MaxFileSize 2147483648
MaxRecursion 20
MaxFiles 10000
AlertExceedsMax yes
ScanArchive yes
ConcurrentDatabaseReload no
SelfCheck 600

