name: Bug report
description: Report a reproducible AVaaS defect (not a security vulnerability)
body:
  - type: markdown
    attributes:
      value: Do not include API keys, presigned URLs, or private files. Report security issues privately per SECURITY.md.
  - type: input
    id: version
    attributes: {label: AVaaS version}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
    validations: {required: true}

