name: CI
on:
  push:
    branches: [main,dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod, cache: true}
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1
        with: {version: latest, install-go: false}
      - uses: golangci/golangci-lint-action@v9
        with: {version: v2.11.4}
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with: {go-package: ./...}
      - name: OpenAPI validation
        run: npx --yes @redocly/cli@1.34.5 lint openapi.yaml
      - name: Shell syntax
        run: for f in scripts/*.sh; do sh -n "$f" && shellcheck "$f"; done
      - name: Compose validation
        run: docker compose config --quiet
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, platforms: linux/amd64}
